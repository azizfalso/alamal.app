name: Build Release APK

on:
  # Auto build on every push to main/master — like the first time.
  push:
    branches: [ main, master ]
  # Manual trigger, in case you want to rebuild without a new commit.
  workflow_dispatch:
    inputs:
      build_note:
        description: 'ملاحظة اختيارية لهذا البناء (تظهر في سجل التشغيل)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Show build info
        run: |
          echo "Build note: ${{ github.event.inputs.build_note }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event:        ${{ github.event_name }}"
          echo "Run number:   ${{ github.run_number }}"
          echo "Version name will be: 1.0.${{ github.run_number }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore and write keystore.properties
        env:
          KS_B64_A: ${{ secrets.KEYSTORE_BASE64 }}
          KS_B64_B: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_V: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_V: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_B64="${KS_B64_A:-${KS_B64_B:-}}"
          if [ -z "$KS_B64" ]; then
            echo "::error title=Missing secret::Neither KEYSTORE_BASE64 nor KEYSTORE is set in Repository secrets."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error title=Missing secret::KEYSTORE_PASSWORD is not set."
            exit 1
          fi
          if [ -z "${KEY_ALIAS_V:-}" ]; then
            echo "::error title=Missing secret::KEY_ALIAS is not set."
            exit 1
          fi
          if [ -z "${KEY_PASSWORD_V:-}" ]; then
            echo "::error title=Missing secret::KEY_PASSWORD is not set."
            exit 1
          fi

          printf '%s' "$KS_B64" | base64 -d > app/keystore.jks
          test -s app/keystore.jks
          echo "keystore.jks written ($(wc -c < app/keystore.jks) bytes)"

          echo "storeFile=keystore.jks"            >  app/keystore.properties
          echo "storePassword=$STORE_PASSWORD"     >> app/keystore.properties
          echo "keyAlias=$KEY_ALIAS_V"             >> app/keystore.properties
          echo "keyPassword=$KEY_PASSWORD_V"       >> app/keystore.properties

      - name: Build release APK
        run: |
          gradle :app:assembleRelease \
            -PversionCodeOverride=${{ github.run_number }} \
            --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alamal-release-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
